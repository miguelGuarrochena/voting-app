<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#FFF8F5"/>
  
  <!-- Main circle background -->
  <circle cx="256" cy="256" r="180" fill="url(#gradient)"/>
  
  <!-- Poll icon -->
  <rect x="156" y="156" width="200" height="200" rx="40" fill="white" opacity="0.9"/>
  
  <!-- Poll bars -->
  <rect x="176" y="196" width="160" height="20" rx="10" fill="#FF4D6A"/>
  <rect x="176" y="236" width="120" height="20" rx="10" fill="#4ECDC4"/>
  <rect x="176" y="276" width="140" height="20" rx="10" fill="#45B7D1"/>
  <rect x="176" y="316" width="100" height="20" rx="10" fill="#F7DC6F"/>
  
  <!-- Check marks -->
  <circle cx="320" cy="206" r="8" fill="white"/>
  <circle cx="280" cy="246" r="8" fill="white"/>
  <circle cx="300" cy="286" r="8" fill="white"/>
  <circle cx="260" cy="326" r="8" fill="white"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#FF4D6A"/>
      <stop offset="100%" stop-color="#E63050"/>
    </linearGradient>
  </defs>
</svg>
