<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    Pickly favicon.
    Background: primary color (#FF4D6A) en rounded square.
    Foreground: blanco — letra P + sparkle decorativo arriba a la derecha.
    Diseño plano, sin filters/glow para que se vea bien a 16x16 también.
  -->

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="#FF4D6A"/>

  <!-- Letter P, centered horizontally -->
  <text
    x="240"
    y="372"
    font-family="'Sora', 'DM Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif"
    font-size="340"
    font-weight="800"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="-8">P</text>

  <!-- Sparkle (cuatro puntas) arriba a la derecha del P -->
  <g fill="#FFFFFF">
    <!-- Punta principal del sparkle -->
    <path d="
      M 388 138
      L 401 174
      L 437 187
      L 401 200
      L 388 236
      L 375 200
      L 339 187
      L 375 174
      Z
    "/>
    <!-- Sparkle secundario, más chico, arriba a la derecha del principal -->
    <path d="
      M 442 92
      L 448 108
      L 464 114
      L 448 120
      L 442 136
      L 436 120
      L 420 114
      L 436 108
      Z
    "/>
  </g>
</svg>
